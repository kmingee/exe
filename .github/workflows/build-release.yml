name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional version tag to publish, for example v0.2
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-arm64
            os: macos-latest
          - target: macos-x86_64
            os: macos-15-intel

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Show toolchain
        run: |
          go version
          uname -a

      - name: Test
        run: go test ./...

      - name: Build
        run: make build

      - name: Package binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp exe dist/package/exe
          if [[ -f exe-net-helper ]]; then
            cp exe-net-helper dist/package/exe-net-helper
          fi
          chmod +x dist/package/*
          tar -czf "dist/exe-${{ matrix.target }}.tar.gz" -C dist/package .

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: exe-${{ matrix.target }}
          path: dist/exe-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: v'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: exe-*
          path: release
          merge-multiple: true

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.release_tag }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -n "${MANUAL_TAG:-}" ]]; then
            tag="$MANUAL_TAG"
          else
            tag="$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1 | sed -E 's/^release:[[:space:]]*//')"
          fi

          if [[ "$tag" != v* ]]; then
            echo "Release tag must start with v: $tag" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release/*.tar.gz)
          if (( ${#files[@]} == 0 )); then
            echo "No release archives were downloaded." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
